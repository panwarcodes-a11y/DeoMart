<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeoMart - Fast Grocery & Food Delivery</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<div class="logo">DeoMart</div>

<div class="nav-icons">
<i class="fas fa-bell"></i>
<i class="fas fa-shopping-cart" onclick="openCart()"></i>
</div>

</div>

<!-- HERO SECTION -->
<div class="hero">

<h1>Fast Grocery & Food Delivery</h1>
<p>Order food, groceries & medicines in minutes</p>

<button onclick="openCart()">Start Shopping</button>

</div>

<!-- LOGIN -->
<div id="user-box">
<button class="login-btn" onclick="login()">
Login With Google
</button>
</div>

<!-- SEARCH -->
<div class="search">
<input type="text" placeholder="Search products...">
</div>

<!-- PRODUCTS -->
<h2 class="section-title">Popular Items</h2>

<div class="products">

<div class="card">
<img src="https://images.pexels.com/photos/1639557/pexels-photo-1639557.jpeg">
<h3>Burger Combo</h3>
<p>₹120</p>
<button onclick="addToCart('Burger Combo',120)">Add</button>
</div>

<div class="card">
<img src="https://images.pexels.com/photos/264636/pexels-photo-264636.jpeg">
<h3>Vegetables</h3>
<p>₹50</p>
<button onclick="addToCart('Vegetables',50)">Add</button>
</div>

<div class="card">
<img src="https://images.pexels.com/photos/208512/pexels-photo-208512.jpeg">
<h3>Medicines</h3>
<p>₹90</p>
<button onclick="addToCart('Medicines',90)">Add</button>
</div>

</div>

<!-- CART -->
<div id="cart">

<h2>Your Cart</h2>

<div id="cart-items"></div>

<h3>Total: ₹<span id="cart-total">0</span></h3>

<button onclick="placeOrder()">Place Order</button>
<button onclick="closeCart()">Close</button>

</div>

<script src="app.js"></script>
<script type="module" src="firebase.js"></script>

</body>
</html>
