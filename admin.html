<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<style>
body{background:#111;color:white;font-family:Arial;padding:20px}
.card{background:#222;padding:10px;margin:10px;border-radius:10px}
button{background:#f7c600;padding:5px;border:none}
</style>
</head>

<body>

<h1>Admin Panel</h1>

<div id="orders"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
updateDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
apiKey:"YOUR_API_KEY",
authDomain:"deomart-bf41e.firebaseapp.com",
projectId:"deomart-bf41e"
});

const db = getFirestore(app);

async function load(){

const snap = await getDocs(collection(db,"orders"));

let html = "";

snap.forEach(d=>{

let data = d.data();

html += `
<div class="card">
<p>Total: ₹${data.total}</p>
<p>Status: ${data.status}</p>

<button onclick="update('${d.id}','Packed')">Packed</button>
<button onclick="update('${d.id}','Delivered')">Delivered</button>
</div>
`;
});

document.getElementById("orders").innerHTML = html;
}

window.update = async (id,status)=>{

await updateDoc(doc(db,"orders",id),{
status:status
});

load();
};

load();

</script>

</body>
</html>
