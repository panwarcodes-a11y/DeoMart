<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeoMart</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body>

<!-- TOP BAR -->
<div class="navbar">

<div class="logo">DeoMart</div>

<div class="nav-icons">
<i class="fas fa-bell"></i>
<i class="fas fa-shopping-cart" onclick="openCart()"></i>
<span id="cart-count">0</span>
</div>

</div>

<!-- HERO BANNER -->
<div class="hero">

<div class="hero-content">

<h1>DeoMart Store</h1>

<p>Fast Grocery | Food Delivery | Medicines</p>

<button onclick="openCart()">Start Shopping</button>

</div>

</div>

<!-- SEARCH BAR -->
<div class="search-container">

<i class="fas fa-search"></i>

<input type="text" placeholder="Search products, food, grocery...">

</div>

<!-- USER -->
<div id="user-box"></div>

<!-- CATEGORIES -->
<h2 class="title">Categories</h2>

<div class="categories">

<div class="card">
<i class="fas fa-shopping-basket"></i>
<p>Grocery</p>
</div>

<div class="card">
<i class="fas fa-pizza-slice"></i>
<p>Food</p>
</div>

<div class="card">
<i class="fas fa-pills"></i>
<p>Medicines</p>
</div>

<div class="card">
<i class="fas fa-truck"></i>
<p>Delivery</p>
</div>

</div>

<!-- PRODUCTS -->
<h2 class="title">Popular Products</h2>

<div class="products">

<div class="product">
<img src="https://images.pexels.com/photos/264636/pexels-photo-264636.jpeg">
<h3>Vegetables</h3>
<p>₹40</p>
<button onclick="addToCart('Vegetables',40)">Add</button>
</div>

<div class="product">
<img src="https://images.pexels.com/photos/1639557/pexels-photo-1639557.jpeg">
<h3>Burger Combo</h3>
<p>₹120</p>
<button onclick="addToCart('Burger Combo',120)">Add</button>
</div>

<div class="product">
<img src="https://images.pexels.com/photos/208512/pexels-photo-208512.jpeg">
<h3>Medicines</h3>
<p>₹80</p>
<button onclick="addToCart('Medicines',80)">Add</button>
</div>

</div>

<!-- CART -->
<div id="cart">

<div class="cart-box">

<h2>Your Cart</h2>

<div id="cart-items"></div>

<h3 id="cart-total">Total: ₹0</h3>

<button onclick="placeOrder()">Checkout</button>

<button onclick="closeCart()">Close</button>

</div>

</div>

<script src="app.js"></script>
<script type="module" src="firebase.js"></script>

</body>
</html>
