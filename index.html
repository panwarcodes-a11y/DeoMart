<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeoMart</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

<div class="logo">DeoMart</div>

<div class="nav-icons">

<i class="fas fa-search"></i>
<i class="fas fa-bell"></i>

<div class="cart-icon">
<i class="fas fa-shopping-cart"></i>
<span id="cart-count">0</span>
</div>

</div>
</div>

<!-- USER -->
<div id="user-box"></div>

<!-- HERO -->
<div class="hero">
<h1>DeoMart Deoband</h1>
<p>Grocery | Food | Medicines | Services</p>
<button onclick="openCart()">Start Shopping</button>
</div>

<!-- SEARCH -->
<div class="search-box">
<input type="text" placeholder="Search anything...">
</div>

<!-- CATEGORIES -->
<h2 class="title">Categories</h2>

<div class="categories">

<div class="card">Grocery</div>
<div class="card">Food</div>
<div class="card">Medicine</div>
<div class="card">Services</div>

</div>

<!-- PRODUCTS -->
<h2 class="title">Products</h2>

<div class="products">

<div class="product">
<img src="https://images.pexels.com/photos/264636/pexels-photo-264636.jpeg">
<h3>Vegetables</h3>
<p>₹40</p>
<button onclick="addToCart('Vegetables',40)">Add</button>
</div>

<div class="product">
<img src="https://images.pexels.com/photos/1639557/pexels-photo-1639557.jpeg">
<h3>Burger Combo</h3>
<p>₹120</p>
<button onclick="addToCart('Burger',120)">Add</button>
</div>

<div class="product">
<img src="https://images.pexels.com/photos/208512/pexels-photo-208512.jpeg">
<h3>Medicines</h3>
<p>₹80</p>
<button onclick="addToCart('Medicines',80)">Add</button>
</div>

</div>

<!-- CART -->
<div id="cart">
<div class="cart-box">

<h2>Your Cart</h2>
<div id="cart-items"></div>

<h3 id="cart-total">Total: ₹0</h3>

<button onclick="closeCart()">Close</button>

</div>
</div>

<!-- JS -->
<script src="app.js"></script>
<script type="module" src="firebase.js"></script>

</body>
</html>
