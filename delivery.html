<!DOCTYPE html>
<html>
<head>
<title>Delivery Panel</title>
</head>

<body style="background:#111;color:white;font-family:Arial">

<h1>Delivery Panel</h1>

<div id="orders"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
getDocs,
updateDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
apiKey:"YOUR_API_KEY",
authDomain:"deomart-bf41e.firebaseapp.com",
projectId:"deomart-bf41e"
});

const db = getFirestore(app);

async function load(){

const snap = await getDocs(collection(db,"orders"));

let html = "";

snap.forEach(d=>{

let data = d.data();

html += `
<div>
<p>Total: ₹${data.total}</p>
<p>Status: ${data.status}</p>

<input id="${d.id}" placeholder="Enter OTP">

<button onclick="deliver('${d.id}','${data.otp}')">Deliver</button>
</div>
`;
});

document.getElementById("orders").innerHTML = html;
}

window.deliver = async (id,otp)=>{

let input = document.getElementById(id).value;

if(input != otp){
alert("Wrong OTP");
return;
}

await updateDoc(doc(db,"orders",id),{
status:"Delivered"
});

alert("Delivered 🚀");
load();
};

load();

</script>

</body>
</html>
